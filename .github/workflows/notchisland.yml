name: Notch Island

on:
  push:
    branches: [notch]
    paths: ['NotchIsland/**', '.github/workflows/notchisland.yml']
  pull_request:
    paths: ['NotchIsland/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NotchIsland

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: gradle --no-daemon testSideloadDebugUnitTest

      - name: Lint the release build
        run: gradle --no-daemon lintVitalSideloadRelease

      - name: Build the shipping artifacts
        run: >
          gradle --no-daemon assembleSideloadDebug assembleSideloadRelease bundlePlayRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notch-island
          path: |
            NotchIsland/app/build/outputs/apk/sideload/debug/app-sideload-debug.apk
            NotchIsland/app/build/outputs/apk/sideload/release/app-sideload-release.apk
            NotchIsland/app/build/outputs/bundle/playRelease/app-play-release.aab

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: NotchIsland/app/build/reports/tests/testSideloadDebugUnitTest
