name: Notch Island

on:
  push:
    branches: [notch]
    paths: ['NotchIsland/**', '.github/workflows/notchisland.yml']
  pull_request:
    paths: ['NotchIsland/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NotchIsland

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        run: gradle --no-daemon lintDebug

      - name: Build APKs
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: notch-island-apks
          path: |
            NotchIsland/app/build/outputs/apk/debug/app-debug.apk
            NotchIsland/app/build/outputs/apk/release/app-release.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: NotchIsland/app/build/reports/tests/testDebugUnitTest
