pluginManagement {
    repositories {
        google()
        mavenCentral()
        // Maven Central throttles bursts with HTTP 429; JetBrains' cache fronts the same content.
        maven { url 'https://cache-redirector.jetbrains.com/maven-central' }
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        // Maven Central throttles bursts with HTTP 429; JetBrains' cache fronts the same content.
        maven { url 'https://cache-redirector.jetbrains.com/maven-central' }
    }
}
rootProject.name = "NotchIsland"
include ':app'
