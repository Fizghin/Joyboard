plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.joyboard.notchisland'
    compileSdk 34

    defaultConfig {
        applicationId "com.joyboard.notchisland"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "2.2.1"
        vectorDrawables.useSupportLibrary true
    }

    signingConfigs {
        // A stable, committed key so that an in-app update always installs over the build the
        // user already has. It is a distribution key for these public APKs only — fork this
        // project and you should swap in your own before shipping anywhere that matters.
        distribution {
            storeFile rootProject.file('keystore/notchisland.jks')
            storePassword 'notchisland'
            keyAlias 'notchisland'
            keyPassword 'notchisland'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.distribution
        }
    }

    flavorDimensions += 'distribution'
    productFlavors {
        // Downloaded from the repository, so it updates itself.
        sideload {
            dimension 'distribution'
            buildConfigField 'boolean', 'UPDATER_ENABLED', 'true'
        }
        // Google Play forbids REQUEST_INSTALL_PACKAGES for a self-updater, and ships its own
        // update path anyway, so that whole feature is compiled out of this variant.
        play {
            dimension 'distribution'
            buildConfigField 'boolean', 'UPDATER_ENABLED', 'false'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    lint {
        abortOnError false
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.navigation:navigation-compose:2.8.2'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
