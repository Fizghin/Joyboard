plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.joyboard.notchisland'
    // Compiled against the newest platform because current AndroidX requires it. The target is
    // 36, the level Play requires — see README "Target SDK" for the behaviour changes involved.
    compileSdk 37

    defaultConfig {
        applicationId "com.joyboard.notchisland"
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName "2.6"
        vectorDrawables.useSupportLibrary true
    }

    signingConfigs {
        // A stable, committed key so that an in-app update always installs over the build the
        // user already has. It is a distribution key for these public APKs only — fork this
        // project and you should swap in your own before shipping anywhere that matters.
        distribution {
            storeFile rootProject.file('keystore/notchisland.jks')
            storePassword 'notchisland'
            keyAlias 'notchisland'
            keyPassword 'notchisland'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.distribution
        }
    }

    flavorDimensions += 'distribution'
    productFlavors {
        // Downloaded from the repository, so it updates itself.
        sideload {
            dimension 'distribution'
            buildConfigField 'boolean', 'UPDATER_ENABLED', 'true'
            // The optional accessibility helper, for hiding in chosen apps and while typing.
            buildConfigField 'boolean', 'HELPER_AVAILABLE', 'true'
        }
        // Google Play forbids REQUEST_INSTALL_PACKAGES for a self-updater, and ships its own
        // update path anyway, so that whole feature is compiled out of this variant.
        play {
            dimension 'distribution'
            buildConfigField 'boolean', 'UPDATER_ENABLED', 'false'
            // Play reserves accessibility services for disability tools, so no helper here.
            buildConfigField 'boolean', 'HELPER_AVAILABLE', 'false'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    lint {
        abortOnError false
    }
    testOptions {
        unitTests {
            returnDefaultValues = true
            // Robolectric needs the merged resources to inflate and theme real views.
            includeAndroidResources = true
            all {
                // Real Skia rendering, so screenshot tests draw what a phone would.
                systemProperty 'robolectric.graphicsMode', 'NATIVE'
                // Screenshots are written, not compared: they are for looking at.
                systemProperty 'roborazzi.test.record', 'true'
                systemProperty 'roborazzi.record.filePathStrategy', 'relativePathFromRoborazziContextOutputDirectory'
                maxHeapSize = '2g'
                // Robolectric emulates file descriptors through JDK internals that JDK 17+ no
                // longer exports by default.
                jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED',
                        '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                        '--add-opens=java.base/java.io=ALL-UNNAMED'
            }
        }
    }
    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.11.0'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.navigation:navigation-compose:2.10.2'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.75.0'
    testImplementation 'androidx.test:core-ktx:1.7.0'
    testImplementation 'androidx.test.ext:junit-ktx:1.3.0'
}
